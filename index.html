<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nimbloom - Giroscopio y Cámara</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }

        /* Video de la cámara de fondo */
        #camara-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Lienzo 3D de Three.js encima del video */
        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Interfaz de usuario */
        #ui {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        button {
            background-color: #ffcc00;
            border: none;
            color: #000;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            width: 100%;
        }

        #info {
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <!-- Elemento de video para la cámara trasera -->
    <video id="camara-video" autoplay playsinline muted></video>

    <!-- Canvas donde Three.js renderizará el objeto 3D -->
    <canvas id="canvas-3d"></canvas>

    <!-- Interfaz de inicio de permisos -->
    <div id="ui">
        <div id="info">Toca el botón para activar la cámara y el giroscopio</div>
        <button id="btn-iniciar">INICIAR EXPERIENCIA</button>
    </div>

    <!-- Importar Three.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const btnIniciar = document.getElementById('btn-iniciar');
        const infoDiv = document.getElementById('info');
        const videoElement = document.getElementById('camara-video');

        let scene, camera, renderer, esfera;

        btnIniciar.addEventListener('click', async () => {
            try {
                // 1. Activar la cámara trasera del celular
                const constraints = {
                    video: {
                        facingMode: {
                            exact: "environment"
                        }
                    }
                };
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: true
                    });
                }
                videoElement.srcObject = stream;

                // 2. Solicitar permisos de giroscopio en iOS (si aplica)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent
                    .requestPermission === 'function') {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        infoDiv.innerText = "Permiso de sensores denegado.";
                        return;
                    }
                }

                // Ocultar menú de inicio
                document.getElementById('ui').style.display = 'none';

                // 3. Inicializar entorno 3D
                init3D();

                // 4. Escuchar el movimiento del giroscopio
                window.addEventListener('deviceorientation', handleOrientation, true);

            } catch (error) {
                alert("Error: Asegúrate de usar HTTPS o permisos de cámara.");
                infoDiv.innerText = "Error al iniciar: " + error;
            }
        });

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const canvas = document.getElementById('canvas-3d');
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Crear una esfera provisional (simulando una nube)
            const geometry = new THREE.SphereGeometry(1, 32, 32);
            const material = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true
            });
            esfera = new THREE.Mesh(geometry, material);

            // Ubicarla al frente en el espacio virtual
            esfera.position.set(0, 0, -5);
            scene.add(esfera);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function handleOrientation(event) {
            let beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            let gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;

            // Vincular la rotación del celular a la cámara virtual
            camera.rotation.x = beta - Math.PI / 2;
            camera.rotation.y = gamma;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (esfera) {
                esfera.rotation.y += 0.01; // Rotación estética de la figura
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>

</html>
