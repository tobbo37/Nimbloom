<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nimbloom - Nubes 3D AR</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
            touch-action: none;
        }

        #camara-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #version-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }

        #ui {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }

        button {
            background-color: #ffcc00;
            border: none;
            color: #000;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            width: 100%;
            pointer-events: auto;
        }

        #info {
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 15px;
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <div id="version-tag">version 1.6</div>

    <video id="camara-video" autoplay playsinline muted></video>
    <canvas id="canvas-3d"></canvas>

    <div id="ui">
        <div id="info">Apunta con el celular a tu habitación y toca Iniciar.</div>
        <button id="btn-iniciar">INICIAR EXPERIENCIA</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const btnIniciar = document.getElementById('btn-iniciar');
        const infoDiv = document.getElementById('info');
        const videoElement = document.getElementById('camara-video');

        let scene, camera, renderer;
        let nubes = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let nubeArrastrada = null;
        let planoArrastre = new THREE.Plane();
        let puntoInterseccion = new THREE.Vector3();

        let initialQuaternion = null;
        let isCalibrated = false;
        const targetQuaternion = new THREE.Quaternion();
        const zee = new THREE.Vector3(0, 0, 1);
        const gq = new THREE.Quaternion();
        const europaQuaternion = new THREE.Euler();
        const correctionQuaternion = new THREE.Quaternion();

        btnIniciar.addEventListener('click', async () => {
            try {
                const constraints = {
                    video: {
                        facingMode: {
                            exact: "environment"
                        }
                    }
                };
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: true
                    });
                }
                videoElement.srcObject = stream;

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent
                    .requestPermission === 'function') {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        infoDiv.innerText = "Permiso de sensores denegado.";
                        return;
                    }
                }

                document.getElementById('ui').style.display = 'none';
                init3D();
                window.addEventListener('deviceorientation', handleOrientation, true);

            } catch (error) {
                alert("Error: Asegúrate de usar HTTPS o permisos de cámara.");
                infoDiv.innerText = "Error al iniciar: " + error;
            }
        });

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const canvas = document.getElementById('canvas-3d');
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const posicionesIniciales = [
                new THREE.Vector3(0, 0, -4), // Frente
                new THREE.Vector3(3, 0, -3), // Derecha
                new THREE.Vector3(-3, 0, -3), // Izquierda
                new THREE.Vector3(0, 2, -4) // Arriba
            ];

            posicionesIniciales.forEach((pos, index) => {
                const nubeGrupo = crearModeloNube();
                nubeGrupo.position.copy(pos);
                nubeGrupo.userData = {
                    id: index,
                    tamano: 1
                };
                scene.add(nubeGrupo);
                nubes.push(nubeGrupo);
            });

            window.addEventListener('pointerdown', onPointerDown, false);
            window.addEventListener('pointermove', onPointerMove, false);
            window.addEventListener('pointerup', onPointerUp, false);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        // Función para construir una nube 3D orgánica uniendo varias esferas
        function crearModeloNube() {
            const grupo = new THREE.Group();

            // Material blanco suave y opaco para simular algodón de nube
            const materialNube = new THREE.MeshLambertMaterial({
                color: 0xffffff,
                flatShading: true
            });

            // Añadir luz ambiental para que las nubes 3D tengan volumen y sombras suaves
            if (!scene.getObjectByName('luzAmbiental')) {
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
                ambientLight.name = 'luzAmbiental';
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
                directionalLight.position.set(5, 10, 7);
                scene.add(directionalLight);
            }

            // Geometrías secundarias para formar los bultos de la nube
            const bultos = [{
                    pos: [0, 0, 0],
                    radio: 0.7
                },
                {
                    pos: [0.5, 0.2, 0],
                    radio: 0.5
                },
                {
                    pos: [-0.5, 0.1, 0.1],
                    radio: 0.5
                },
                {
                    pos: [0.2, -0.3, -0.2],
                    radio: 0.4
                },
                {
                    pos: [-0.2, -0.2, 0.2],
                    radio: 0.4
                }
            ];

            bultos.forEach(b => {
                const geo = new THREE.SphereGeometry(b.radio, 16, 16);
                const mesh = new THREE.Mesh(geo, materialNube);
                mesh.position.set(b.pos[0], b.pos[1], b.pos[2]);
                grupo.add(mesh);
            });

            return grupo;
        }

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            // Mapeamos los hijos de los grupos para el Raycaster
            const intersects = raycaster.intersectObjects(nubes, true);

            if (intersects.length > 0) {
                // Encontrar el grupo raíz de la nube seleccionada
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== scene) {
                    obj = obj.parent;
                }
                nubeArrastrada = obj;
                const normalCamara = camera.getWorldDirection(new THREE.Vector3()).negate();
                planoArrastre.setFromNormalAndCoplanarPoint(normalCamara, nubeArrastrada.position);
            }
        }

        function onPointerMove(event) {
            if (!nubeArrastrada) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (raycaster.ray.intersectPlane(planoArrastre, puntoInterseccion)) {
                nubeArrastrada.position.copy(puntoInterseccion);
            }
        }

        function onPointerUp() {
            nubeArrastrada = null;
        }

        function verificarFusion() {
            for (let i = 0; i < nubes.length; i++) {
                for (let j = i + 1; j < nubes.length; j++) {
                    const n1 = nubes[i];
                    const n2 = nubes[j];

                    const distancia = n1.position.distanceTo(n2.position);

                    if (distancia < 1.3) {
                        n1.userData.tamano += n2.userData.tamano;
                        const nuevaEscala = Math.cbrt(n1.userData.tamano);
                        n1.scale.set(nuevaEscala, nuevaEscala, nuevaEscala);

                        scene.remove(n2);
                        nubes.splice(j, 1);
                        return;
                    }
                }
            }
        }

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

            europaQuaternion.set(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(europaQuaternion);
            targetQuaternion.multiply(gq.setFromAxisAngle(zee, -orient));

            if (!isCalibrated) {
                correctionQuaternion.copy(targetQuaternion).invert();
                isCalibrated = true;
            }

            targetQuaternion.premultiply(correctionQuaternion);
            camera.quaternion.copy(targetQuaternion);
        }

        function animate() {
            requestAnimationFrame(animate);

            nubes.forEach(nube => {
                nube.rotation.y += 0.005;
            });

            verificarFusion();

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>

</html>
