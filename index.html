<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nimbloom - Fusión de Nubes AR</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
            touch-action: none;
            /* Evita pull-to-refresh y zoom accidental */
        }

        #camara-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #ui {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
            /* Permite tocar el canvas detrás */
        }

        button {
            background-color: #ffcc00;
            border: none;
            color: #000;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            width: 100%;
            pointer-events: auto;
        }

        #info {
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 15px;
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <video id="camara-video" autoplay playsinline muted></video>
    <canvas id="canvas-3d"></canvas>

    <div id="ui">
        <div id="info">Toca para iniciar. Mantén presionado y arrastra las nubes para unirlas.</div>
        <button id="btn-iniciar">INICIAR EXPERIENCIA</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const btnIniciar = document.getElementById('btn-iniciar');
        const infoDiv = document.getElementById('info');
        const videoElement = document.getElementById('camara-video');

        let scene, camera, renderer;
        let esferas = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let esferaArrastrada = null;
        let planoArrastre = new THREE.Plane();
        let puntoInterseccion = new THREE.Vector3();

        const targetQuaternion = new THREE.Quaternion();
        const zee = new THREE.Vector3(0, 0, 1);
        const gq = new THREE.Quaternion();
        const europaQuaternion = new THREE.Euler();

        btnIniciar.addEventListener('click', async () => {
            try {
                const constraints = {
                    video: {
                        facingMode: {
                            exact: "environment"
                        }
                    }
                };
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: true
                    });
                }
                videoElement.srcObject = stream;

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent
                    .requestPermission === 'function') {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        infoDiv.innerText = "Permiso de sensores denegado.";
                        return;
                    }
                }

                document.getElementById('ui').style.display = 'none';
                init3D();
                window.addEventListener('deviceorientation', handleOrientation, true);

            } catch (error) {
                alert("Error: Asegúrate de usar HTTPS o permisos de cámara.");
                infoDiv.innerText = "Error al iniciar: " + error;
            }
        });

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const canvas = document.getElementById('canvas-3d');
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Crear 4 nubes (esferas) distribuidas en distintas posiciones iniciales
            const posicionesIniciales = [
                new THREE.Vector3(0, 0, -4), // Frente
                new THREE.Vector3(3, 0, -3), // Derecha
                new THREE.Vector3(-3, 0, -3), // Izquierda
                new THREE.Vector3(0, 2, -4) // Arriba
            ];

            const materialNube = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true
            });

            posicionesIniciales.forEach((pos, index) => {
                const geometria = new THREE.SphereGeometry(0.8, 24, 24);
                const esfera = new THREE.Mesh(geometria, materialNube);
                esfera.position.copy(pos);
                esfera.userData = {
                    id: index,
                    tamano: 1
                }; // Propiedad de tamaño
                scene.add(esfera);
                esferas.push(esfera);
            });

            // Eventos táctiles para arrastrar las nubes
            window.addEventListener('pointerdown', onPointerDown, false);
            window.addEventListener('pointermove', onPointerMove, false);
            window.addEventListener('pointerup', onPointerUp, false);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(esferas);

            if (intersects.length > 0) {
                esferaArrastrada = intersects[0].object;
                // Crear un plano invisible frente a la cámara para mantener la profundidad al arrastrar
                const normalCamara = camera.getWorldDirection(new THREE.Vector3()).negate();
                planoArrastre.setFromNormalAndCoplanarPoint(normalCamara, esferaArrastrada.position);
            }
        }

        function onPointerMove(event) {
            if (!esferaArrastrada) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (raycaster.ray.intersectPlane(planoArrastre, puntoInterseccion)) {
                esferaArrastrada.position.copy(puntoInterseccion);
            }
        }

        function onPointerUp() {
            esferaArrastrada = null;
        }

        function verificarFusion() {
            // Revisar si alguna esfera está cerca de otra para fusionarlas
            for (let i = 0; i < esferas.length; i++) {
                for (let j = i + 1; j < esferas.length; j++) {
                    const e1 = esferas[i];
                    const e2 = esferas[j];

                    const distancia = e1.position.distanceTo(e2.position);

                    // Si están a menos de 1.2 metros de distancia, se fusionan
                    if (distancia < 1.2) {
                        // e1 absorbe a e2
                        e1.userData.tamano += e2.userData.tamano;

                        // Aumentar la escala visual de e1 en base a cuántas absorbió
                        const nuevaEscala = Math.cbrt(e1.userData.tamano); // Crecimiento proporcional en 3D
                        e1.scale.set(nuevaEscala, nuevaEscala, nuevaEscala);

                        // Eliminar e2 de la escena y del arreglo
                        scene.remove(e2);
                        esferas.splice(j, 1);
                        return; // Salir para evitar errores en el ciclo
                    }
                }
            }
        }

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

            europaQuaternion.set(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(europaQuaternion);
            targetQuaternion.multiply(gq.setFromAxisAngle(zee, -orient));

            camera.quaternion.copy(targetQuaternion);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotación estética de las nubes y chequeo de fusiones
            esferas.forEach(esfera => {
                esfera.rotation.y += 0.01;
            });

            verificarFusion();

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>

</html>
