<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nimbloom</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            background-image: url('img/fondo.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Quicksand', sans-serif;
            touch-action: none;
        }

        #camara-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #version-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            color: #FDF7FF;
            background: rgba(165, 88, 204, 0.5);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }

        #btn-recalibrar {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 20;
            background: rgba(194, 194, 244, 0.8);
            color: #A558CC;
            border: 2px solid #FDF7FF;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            pointer-events: auto;
        }

        #contador-nubes {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 20;
            color: #A558CC;
            background: rgba(253, 247, 255, 0.8);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            pointer-events: none;
            display: none;
        }

        /* Indicadores de dirección (Radar off-screen 360°) */
        .flecha-guia {
            position: absolute;
            z-index: 15;
            color: #FFFEAE;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px #A558CC;
            pointer-events: none;
            display: none;
            animation: latido 1s infinite alternate;
        }

        @keyframes latido {
            from {
                transform: scale(1);
                opacity: 0.7;
            }

            to {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }

        .btn-principal {
            background-color: #A558CC;
            border: 2px solid #FDF7FF;
            color: #FDF7FF;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            width: 100%;
            pointer-events: auto;
            font-family: 'Quicksand', sans-serif;
            transition: all 0.3s ease;
        }

        .btn-principal:disabled {
            background-color: #ccc;
            color: #666;
            cursor: not-allowed;
            border-color: #999;
        }

        .btn-principal:not(:disabled):active {
            background-color: #FFFEAE;
            color: #A558CC;
        }

        #info {
            color: #A558CC;
            background: rgba(253, 247, 255, 0.9);
            border: 1px solid #C2C2F4;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 25px;
            pointer-events: auto;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <button id="btn-recalibrar">⟲ Centrar vista</button>
    <div id="version-tag">version 1.37</div>
    <div id="contador-nubes">Nubes: 4</div>

    <!-- Flechas guía para el universo 360° -->
    <div id="guia-arriba" class="flecha-guia" style="top: 20px; left: 50%; transform: translateX(-50%);">▲</div>
    <div id="guia-abajo" class="flecha-guia" style="bottom: 60px; left: 50%; transform: translateX(-50%);">▼</div>
    <div id="guia-izquierda" class="flecha-guia" style="top: 50%; left: 20px; transform: translateY(-50%);">◀</div>
    <div id="guia-derecha" class="flecha-guia" style="top: 50%; right: 20px; transform: translateY(-50%);">▶</div>

    <video id="camara-video" autoplay playsinline muted></video>
    <canvas id="canvas-3d"></canvas>

    <div id="ui">
        <div id="info">Tomate un momento para vos. Girate y buscá las 4 nubes por la habitación; seguí las flechas si
            alguna se oculta.</div>
        <button id="btn-iniciar" class="btn-principal" disabled>CARGANDO MODELOS...</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const btnIniciar = document.getElementById('btn-iniciar');
        const btnRecalibrar = document.getElementById('btn-recalibrar');
        const infoDiv = document.getElementById('info');
        const videoElement = document.getElementById('camara-video');
        const contadorDiv = document.getElementById('contador-nubes');

        const guiaArriba = document.getElementById('guia-arriba');
        const guiaAbajo = document.getElementById('guia-abajo');
        const guiaIzquierda = document.getElementById('guia-izquierda');
        const guiaDerecha = document.getElementById('guia-derecha');

        let scene, camera, renderer;
        let nubes = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let nubeArrastrada = null;

        let isCalibrated = false;
        let juegoTerminado = false;

        let modelosBase = [];
        let modelosCargadosCount = 0;

        let textCanvas, textTexture, textMesh;
        let modeloVisualFinal = null;

        // ==========================================
        // VARIABLES DE AJUSTE
        // ==========================================
        const ESCALA_MODELO_GLTF = 0.2;
        const TAMAÑO_TEXTO = 0.9;
        const ALTURA_TEXTO = 1.0;
        const PROFUNDIDAD_TEXTO = -0.5;

        const POSICION_MODELO_FINAL = new THREE.Vector3(1.5, -0.2, -3.5);
        // ==========================================

        const targetQuaternion = new THREE.Quaternion();
        const currentDeviceQuaternion = new THREE.Quaternion();
        const zee = new THREE.Vector3(0, 0, 1);
        const gq = new THREE.Quaternion();
        const europaQuaternion = new THREE.Euler();
        const correctionQuaternion = new THREE.Quaternion();

        const COLORES = {
            lavanda: 0xC2C2F4,
            amarillo: 0xFFFEAE
        };

        const loader = new THREE.GLTFLoader();
        const archivosModelos = ['model/nubejonas.glb', 'model/nubejonas2.glb'];

        archivosModelos.forEach((ruta, index) => {
            loader.load(ruta, function (gltf) {
                const modeloBase = gltf.scene;

                modeloBase.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material.transparent = true;
                        child.material.opacity = 0.98;
                    }
                });

                modelosBase[index] = modeloBase;
                modelosCargadosCount++;

                if (modelosCargadosCount === archivosModelos.length) {
                    btnIniciar.innerText = "CONECTAR";
                    btnIniciar.disabled = false;
                }

            }, undefined, function (error) {
                console.error("Error al cargar " + ruta, error);
            });
        });

        btnIniciar.addEventListener('click', async () => {
            try {
                const constraints = {
                    video: {
                        facingMode: {
                            exact: "environment"
                        }
                    }
                };
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: true
                    });
                }
                videoElement.srcObject = stream;

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent
                    .requestPermission === 'function') {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') return;
                }

                document.getElementById('ui').style.display = 'none';
                contadorDiv.style.display = 'block';
                btnRecalibrar.style.display = 'block';

                document.fonts.ready.then(() => {
                    init3D();
                    window.addEventListener('deviceorientation', handleOrientation, true);
                });

            } catch (error) {
                alert("Error de cámara.");
            }
        });

        btnRecalibrar.addEventListener('click', () => {
            isCalibrated = false;
        });

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            scene.add(camera);

            const canvas = document.getElementById('canvas-3d');
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            if (!scene.getObjectByName('luzAmbiental')) {
                const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
                ambientLight.name = 'luzAmbiental';
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(COLORES.lavanda, 0.8);
                directionalLight.position.set(5, 12, 8);
                scene.add(directionalLight);
            }

            const posiciones4Nubes = [
                new THREE.Vector3(0, 0.5, -3.0), // 1. Al frente
                new THREE.Vector3(3.0, 0.2, -2.0), // 2. A la derecha
                new THREE.Vector3(-3.0, 0.2, -2.0), // 3. A la izquierda
                new THREE.Vector3(0, 2.2, 1.5) // 4. Arriba y hacia atrás
            ];

            posiciones4Nubes.forEach((pos, index) => {
                const nubeGrupo = new THREE.Group();

                const modeloAleatorio = modelosBase[Math.floor(Math.random() * modelosBase.length)];
                const nubeVisual = modeloAleatorio.clone();

                nubeVisual.scale.set(ESCALA_MODELO_GLTF, ESCALA_MODELO_GLTF, ESCALA_MODELO_GLTF);

                nubeGrupo.add(nubeVisual);
                nubeGrupo.position.copy(pos);
                nubeGrupo.userData = {
                    id: index,
                    tamano: 1
                };

                scene.add(nubeGrupo);
                nubes.push(nubeGrupo);
            });

            actualizarContador();

            window.addEventListener('pointerdown', onPointerDown, false);
            window.addEventListener('pointermove', onPointerMove, false);
            window.addEventListener('pointerup', onPointerUp, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onPointerDown(event) {
            if (juegoTerminado) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nubes, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== scene) {
                    obj = obj.parent;
                }
                nubeArrastrada = obj;
                nubeArrastrada.userData.distanciaFija = nubeArrastrada.position.distanceTo(camera.position);
            }
        }

        function onPointerMove(event) {
            if (!nubeArrastrada || juegoTerminado) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const dirRayo = raycaster.ray.direction.clone();
            nubeArrastrada.position.copy(camera.position).add(dirRayo.multiplyScalar(nubeArrastrada.userData
                .distanciaFija));
        }

        function onPointerUp() {
            nubeArrastrada = null;
        }

        function crearLienzoTexto3D(nubeFinal) {
            textCanvas = document.createElement('canvas');
            textCanvas.width = 1024;
            textCanvas.height = 1024;
            textTexture = new THREE.CanvasTexture(textCanvas);
            textTexture.minFilter = THREE.LinearFilter;

            const planeGeo = new THREE.PlaneGeometry(TAMAÑO_TEXTO, TAMAÑO_TEXTO);

            const planeMat = new THREE.MeshBasicMaterial({
                map: textTexture,
                transparent: true,
                depthWrite: false,
                depthTest: false,
                side: THREE.DoubleSide
            });

            textMesh = new THREE.Mesh(planeGeo, planeMat);
            textMesh.renderOrder = 999;

            textMesh.position.set(0, ALTURA_TEXTO, PROFUNDIDAD_TEXTO);
            textMesh.rotation.y = Math.PI;

            textMesh.scale.set(0.01, 0.01, 0.01);
            nubeFinal.add(textMesh);
        }

        function actualizarTexturaNube() {
            if (!textCanvas) return;
            const ctx = textCanvas.getContext('2d');
            ctx.clearRect(0, 0, textCanvas.width, textCanvas.height);

            ctx.save();
            ctx.scale(-1, 1);
            ctx.translate(-textCanvas.width, 0);

            const ahora = new Date();
            let anioActual = ahora.getFullYear();
            let objetivo = new Date(anioActual, 9, 10, 0, 0, 0);
            if (ahora > objetivo) objetivo = new Date(anioActual + 1, 9, 10, 0, 0, 0);

            const dif = objetivo - ahora;
            const dias = Math.floor(dif / (1000 * 60 * 60 * 24));
            const horas = Math.floor((dif % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((dif % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((dif % (1000 * 60)) / 1000);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Título NIMBLOOM
            ctx.shadowColor = 'rgba(165, 88, 204, 0.9)';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#FFFEAE';
            ctx.font = '400 130px "Cherry Bomb One"';
            ctx.fillText('NIMBLOOM', 512, 380);

            // Contador de días, horas, minutos y segundos
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#A558CC';
            ctx.font = '700 95px "Quicksand"';
            ctx.fillText(
                `${dias}d ${String(horas).padStart(2, '0')}h ${String(minutos).padStart(2, '0')}m ${String(segundos).padStart(2, '0')}s`,
                512, 560);

            // Fecha 10 de Octubre
            ctx.fillStyle = '#C2C2F4';
            ctx.font = '700 70px "Quicksand"';
            ctx.fillText('10 DE OCTUBRE', 512, 700);

            ctx.restore();
            textTexture.needsUpdate = true;
        }

        // Radar visual para orientar al usuario en el giro físico 360°
        function actualizarGuiasVisuales() {
            if (juegoTerminado || nubes.length === 0) {
                guiaArriba.style.display = 'none';
                guiaAbajo.style.display = 'none';
                guiaIzquierda.style.display = 'none';
                guiaDerecha.style.display = 'none';
                return;
            }

            let mostrarArriba = false;
            let mostrarAbajo = false;
            let mostrarIzquierda = false;
            let mostrarDerecha = false;

            const vectorTemp = new THREE.Vector3();

            nubes.forEach(nube => {
                vectorTemp.copy(nube.position);
                vectorTemp.project(camera);

                if (vectorTemp.z > 1) {
                    if (vectorTemp.x < 0) mostrarDerecha = true;
                    else mostrarIzquierda = true;
                    return;
                }

                if (vectorTemp.y > 0.9) mostrarArriba = true;
                if (vectorTemp.y < -0.9) mostrarAbajo = true;
                if (vectorTemp.x < -0.9) mostrarIzquierda = true;
                if (vectorTemp.x > 0.9) mostrarDerecha = true;
            });

            guiaArriba.style.display = mostrarArriba ? 'block' : 'none';
            guiaAbajo.style.display = mostrarAbajo ? 'block' : 'none';
            guiaIzquierda.style.display = mostrarIzquierda ? 'block' : 'none';
            guiaDerecha.style.display = mostrarDerecha ? 'block' : 'none';
        }

        function verificarFusion() {
            if (juegoTerminado) return;

            // EFECTO IMÁN SUTIL: Cuando quedan 2 nubes, se acercan muy lentamente y de forma disimulada
            if (nubes.length === 2 && nubeArrastrada === null) {
                nubes[0].position.lerp(nubes[1].position, 0.004);
            }

            for (let i = 0; i < nubes.length; i++) {
                for (let j = i + 1; j < nubes.length; j++) {
                    const n1 = nubes[i];
                    const n2 = nubes[j];

                    const distancia = n1.position.distanceTo(n2.position);
                    // Umbral de fusión optimizado para asegurar detección fluida en todo el espacio
                    const umbralFusion = 1.2;

                    if (distancia < umbralFusion) {
                        n1.userData.tamano += n2.userData.tamano;

                        const baseScale = ESCALA_MODELO_GLTF;
                        const growthFactor = Math.cbrt(n1.userData.tamano);
                        const nuevaEscala = baseScale * growthFactor;
                        n1.children[0].scale.set(nuevaEscala, nuevaEscala, nuevaEscala);

                        scene.remove(n2);
                        nubes.splice(j, 1);
                        actualizarContador();

                        if (nubes.length === 1) {
                            juegoTerminado = true;
                            contadorDiv.style.display = 'none';
                            btnRecalibrar.style.display = 'none';
                            guiaArriba.style.display = 'none';
                            guiaAbajo.style.display = 'none';
                            guiaIzquierda.style.display = 'none';
                            guiaDerecha.style.display = 'none';

                            const nubeFinal = nubes[0];
                            const modeloFijoBase = modelosBase[0].clone();

                            nubeFinal.remove(nubeFinal.children[0]);
                            nubeFinal.add(modeloFijoBase);
                            modeloVisualFinal = modeloFijoBase;

                            const finalScale = ESCALA_MODELO_GLTF * Math.cbrt(nubeFinal.userData.tamano) * 1.8;
                            modeloVisualFinal.scale.set(finalScale, finalScale, finalScale);

                            crearLienzoTexto3D(nubeFinal);
                            camera.attach(nubeFinal);
                        }
                        return;
                    }
                }
            }
        }

        function actualizarContador() {
            contadorDiv.innerText = "Nubes: " + nubes.length;
        }

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

            europaQuaternion.set(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(europaQuaternion);
            targetQuaternion.multiply(gq.setFromAxisAngle(zee, -orient));

            if (!isCalibrated) {
                correctionQuaternion.copy(targetQuaternion).invert();
                isCalibrated = true;
            }

            let tempQuat = new THREE.Quaternion().copy(targetQuaternion).premultiply(correctionQuaternion);
            currentDeviceQuaternion.copy(tempQuat);
        }

        function animate() {
            requestAnimationFrame(animate);

            camera.quaternion.slerp(currentDeviceQuaternion, 0.08);

            if (juegoTerminado && nubes.length > 0) {
                const nubeFinal = nubes[0];

                nubeFinal.position.lerp(POSICION_MODELO_FINAL, 0.04);

                if (textMesh) {
                    const finalScale = ESCALA_MODELO_GLTF * 4;
                    const textoScale = finalScale * 3.5;
                    textMesh.scale.lerp(new THREE.Vector3(textoScale, textoScale, textoScale), 0.03);
                }

                nubeFinal.quaternion.slerp(new THREE.Quaternion(), 0.04);

                if (modeloVisualFinal) {
                    const targetRotModelo = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI / 2, 0));
                    modeloVisualFinal.quaternion.slerp(targetRotModelo, 0.04);
                }

                actualizarTexturaNube();
            } else {
                actualizarGuiasVisuales();
            }

            verificarFusion();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>

</html>
