<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nimbloom</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
            touch-action: none;
        }

        #camara-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #version-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }

        #contador-nubes {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 20;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            display: none;
        }

        /* Pantalla de victoria / cuenta regresiva */
        #pantalla-victoria {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            text-align: center;
            width: 90%;
            max-width: 500px;
            display: none;
            pointer-events: none;
        }

        h1.titulo-nimbloom {
            color: #ffffff;
            font-size: 50px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 204, 0, 0.6);
        }

        #reloj-regresivo {
            color: #ffcc00;
            font-size: 24px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }

        #sub-fecha {
            color: #ddd;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
        }

        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }

        h1.titulo-juego {
            color: #ffffff;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
        }

        button {
            background-color: #ffcc00;
            border: none;
            color: #000;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            width: 100%;
            pointer-events: auto;
        }

        #info {
            color: #ddd;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            pointer-events: auto;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <div id="version-tag">version 1.8</div>
    <div id="contador-nubes">Nubes: 8</div>

    <!-- Pantalla final de victoria -->
    <div id="pantalla-victoria">
        <h1 class="titulo-nimbloom">NIMBLOOM</h1>
        <div id="reloj-regresivo">00h 00m 00s</div>
        <div id="sub-fecha">10 de octubre</div>
    </div>

    <video id="camara-video" autoplay playsinline muted></video>
    <canvas id="canvas-3d"></canvas>

    <div id="ui">
        <h1 class="titulo-juego">Nimbloom</h1>
        <div id="info">Apunta con el celular a tu habitación y toca Iniciar. Arrastra las nubes para unirlas todas en
            una sola.</div>
        <button id="btn-iniciar">INICIAR EXPERIENCIA</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const btnIniciar = document.getElementById('btn-iniciar');
        const infoDiv = document.getElementById('info');
        const videoElement = document.getElementById('camara-video');
        const contadorDiv = document.getElementById('contador-nubes');
        const pantallaVictoria = document.getElementById('pantalla-victoria');
        const relojDiv = document.getElementById('reloj-regresivo');

        let scene, camera, renderer;
        let nubes = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let nubeArrastrada = null;
        let planoArrastre = new THREE.Plane();
        let puntoInterseccion = new THREE.Vector3();

        let isCalibrated = false;
        let juegoTerminado = false;
        const targetQuaternion = new THREE.Quaternion();
        const zee = new THREE.Vector3(0, 0, 1);
        const gq = new THREE.Quaternion();
        const europaQuaternion = new THREE.Euler();
        const correctionQuaternion = new THREE.Quaternion();

        btnIniciar.addEventListener('click', async () => {
            try {
                const constraints = {
                    video: {
                        facingMode: {
                            exact: "environment"
                        }
                    }
                };
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: true
                    });
                }
                videoElement.srcObject = stream;

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent
                    .requestPermission === 'function') {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        infoDiv.innerText = "Permiso de sensores denegado.";
                        return;
                    }
                }

                document.getElementById('ui').style.display = 'none';
                contadorDiv.style.display = 'block';
                init3D();
                window.addEventListener('deviceorientation', handleOrientation, true);

            } catch (error) {
                alert("Error: Asegúrate de usar HTTPS o permisos de cámara.");
                infoDiv.innerText = "Error al iniciar: " + error;
            }
        });

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const canvas = document.getElementById('canvas-3d');
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const posicionesVariadas = [
                new THREE.Vector3(0, 0.2, -3.5),
                new THREE.Vector3(2.5, 0.5, -4.5),
                new THREE.Vector3(-2.8, -0.2, -4),
                new THREE.Vector3(1.2, 1.8, -3),
                new THREE.Vector3(-1.5, 1.5, -5),
                new THREE.Vector3(4, -0.5, -6),
                new THREE.Vector3(-4, 0.2, -5.5),
                new THREE.Vector3(0, -1, -4.5)
            ];

            posicionesVariadas.forEach((pos, index) => {
                const nubeGrupo = crearModeloNubeRealista();
                nubeGrupo.position.copy(pos);
                nubeGrupo.userData = {
                    id: index,
                    tamano: 1
                };
                scene.add(nubeGrupo);
                nubes.push(nubeGrupo);
            });

            actualizarContador();

            window.addEventListener('pointerdown', onPointerDown, false);
            window.addEventListener('pointermove', onPointerMove, false);
            window.addEventListener('pointerup', onPointerUp, false);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function crearModeloNubeRealista() {
            const grupo = new THREE.Group();

            const materialNube = new THREE.MeshLambertMaterial({
                color: 0xffffff,
                flatShading: true,
                transparent: true,
                opacity: 0.92
            });

            if (!scene.getObjectByName('luzAmbiental')) {
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
                ambientLight.name = 'luzAmbiental';
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
                directionalLight.position.set(5, 12, 8);
                scene.add(directionalLight);
            }

            const partesNube = [{
                    pos: [0, 0, 0],
                    escala: [1.2, 0.7, 0.8]
                },
                {
                    pos: [-0.5, 0.1, 0.0],
                    escala: [0.8, 0.6, 0.7]
                },
                {
                    pos: [0.5, 0.15, -0.1],
                    escala: [0.85, 0.65, 0.75]
                },
                {
                    pos: [0.2, 0.35, 0.1],
                    escala: [0.65, 0.55, 0.6]
                },
                {
                    pos: [-0.2, 0.3, -0.1],
                    escala: [0.7, 0.5, 0.65]
                },
                {
                    pos: [0, -0.25, 0.0],
                    escala: [0.9, 0.4, 0.7]
                }
            ];

            partesNube.forEach(p => {
                const geo = new THREE.SphereGeometry(0.6, 20, 20);
                const mesh = new THREE.Mesh(geo, materialNube);
                mesh.position.set(p.pos[0], p.pos[1], p.pos[2]);
                mesh.scale.set(p.escala[0], p.escala[1], p.escala[2]);
                grupo.add(mesh);
            });

            return grupo;
        }

        function onPointerDown(event) {
            if (juegoTerminado) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nubes, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== scene) {
                    obj = obj.parent;
                }
                nubeArrastrada = obj;
                const normalCamara = camera.getWorldDirection(new THREE.Vector3()).negate();
                planoArrastre.setFromNormalAndCoplanarPoint(normalCamara, nubeArrastrada.position);
            }
        }

        function onPointerMove(event) {
            if (!nubeArrastrada || juegoTerminado) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (raycaster.ray.intersectPlane(planoArrastre, puntoInterseccion)) {
                nubeArrastrada.position.copy(puntoInterseccion);
            }
        }

        function onPointerUp() {
            nubeArrastrada = null;
        }

        function verificarFusion() {
            if (juegoTerminado) return;

            for (let i = 0; i < nubes.length; i++) {
                for (let j = i + 1; j < nubes.length; j++) {
                    const n1 = nubes[i];
                    const n2 = nubes[j];

                    const distancia = n1.position.distanceTo(n2.position);

                    // Margen de distancia amplio para asegurar que se junten sin importar tamaño
                    if (distancia < 1.8) {
                        n1.userData.tamano += n2.userData.tamano;

                        // Escala proporcional adaptada para que crezcan masivamente hasta unirse en una sola
                        const nuevaEscala = Math.cbrt(n1.userData.tamano) * 1.15;
                        n1.scale.set(nuevaEscala, nuevaEscala, nuevaEscala);

                        scene.remove(n2);
                        nubes.splice(j, 1);

                        actualizarContador();

                        // Si queda solo 1 nube, activar animación y pantalla final de victoria
                        if (nubes.length === 1) {
                            juegoTerminado = true;
                            contadorDiv.style.display = 'none';
                            pantallaVictoria.style.display = 'block';
                        }
                        return;
                    }
                }
            }
        }

        function actualizarContador() {
            contadorDiv.innerText = "Nubes: " + nubes.length;
        }

        function actualizarContadorTiempo() {
            const ahora = new Date();
            let anioActual = ahora.getFullYear();
            let objetivo = new Date(anioActual, 9, 10, 0, 0, 0); // 10 de octubre (Mes 9 en JS)

            if (ahora > objetivo) {
                objetivo = new Date(anioActual + 1, 9, 10, 0, 0, 0);
            }

            const diferencia = objetivo - ahora;
            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            relojDiv.innerText =
                `${String(horas).padStart(2, '0')}h ${String(minutos).padStart(2, '0')}m ${String(segundos).padStart(2, '0')}s`;
        }

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

            europaQuaternion.set(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(europaQuaternion);
            targetQuaternion.multiply(gq.setFromAxisAngle(zee, -orient));

            if (!isCalibrated) {
                correctionQuaternion.copy(targetQuaternion).invert();
                isCalibrated = true;
            }

            targetQuaternion.premultiply(correctionQuaternion);
            camera.quaternion.copy(targetQuaternion);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (juegoTerminado && nubes.length > 0) {
                const nubeFinal = nubes[0];
                const tiempo = Date.now() * 0.003;

                // Animación de giro sobre sí misma (volteándose)
                nubeFinal.rotation.y += 0.02;
                nubeFinal.rotation.x = Math.sin(tiempo * 0.5) * 0.3;

                // Animación de brillo y cambio de colores dinámicos
                nubeFinal.traverse((child) => {
                    if (child.isMesh) {
                        const tonoHue = (Date.now() * 0.05) % 360;
                        child.material.color.setHSL(tonoHue / 360, 0.8, 0.7);
                    }
                });

                actualizarContadorTiempo();
            }

            verificarFusion();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>

</html>
