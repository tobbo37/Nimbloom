<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nimbloom</title>

    <!-- Integración de las tipografías del manual de marca -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: 'Quicksand', sans-serif;
            /* Tipografía para textos y UI */
            touch-action: none;
        }

        #camara-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #version-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            color: #FDF7FF;
            /* Blanco luminosidad */
            background: rgba(165, 88, 204, 0.5);
            /* Violeta con transparencia */
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }

        #btn-recalibrar {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 20;
            background: rgba(194, 194, 244, 0.8);
            /* Lavanda */
            color: #A558CC;
            /* Violeta */
            border: 2px solid #FDF7FF;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            pointer-events: auto;
        }

        #contador-nubes {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 20;
            color: #A558CC;
            /* Violeta */
            background: rgba(253, 247, 255, 0.8);
            /* Blanco transparente */
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            pointer-events: none;
            display: none;
        }

        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }

        h1.titulo-juego {
            color: #FDF7FF;
            /* Blanco nube */
            font-family: 'Cherry Bomb One', cursive;
            /* Tipografía para títulos */
            font-size: 50px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(217, 170, 241, 0.8);
            /* Sombra Lila */
            -webkit-text-stroke: 1px #A558CC;
        }

        .btn-principal {
            background-color: #A558CC;
            /* Violeta boton primario */
            border: 2px solid #FDF7FF;
            color: #FDF7FF;
            /* Blanco para textos sobre fondos claros/oscuros */
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            width: 100%;
            pointer-events: auto;
            font-family: 'Quicksand', sans-serif;
            transition: all 0.3s ease;
        }

        .btn-principal:active {
            background-color: #FFFEAE;
            /* Amarillo al presionar (Acento) */
            color: #A558CC;
        }

        #info {
            color: #A558CC;
            background: rgba(253, 247, 255, 0.9);
            border: 1px solid #C2C2F4;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 25px;
            pointer-events: auto;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <button id="btn-recalibrar">⟲ Centrar espacio</button>
    <div id="version-tag">version 1.13</div>
    <div id="contador-nubes">Nubes: 8</div>

    <video id="camara-video" autoplay playsinline muted></video>
    <canvas id="canvas-3d"></canvas>

    <div id="ui">
        <h1 class="titulo-juego">Nimbloom</h1>
        <!-- Tono de voz sereno y cercano -->
        <div id="info">Tomate un momento para vos. Respirá a tu ritmo, arrastrá las nubes para abrazarlas y descubrí el
            florecimiento.</div>
        <button id="btn-iniciar" class="btn-principal">CONECTAR</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const btnIniciar = document.getElementById('btn-iniciar');
        const btnRecalibrar = document.getElementById('btn-recalibrar');
        const infoDiv = document.getElementById('info');
        const videoElement = document.getElementById('camara-video');
        const contadorDiv = document.getElementById('contador-nubes');

        let scene, camera, renderer;
        let nubes = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let nubeArrastrada = null;
        let planoArrastre = new THREE.Plane();
        let puntoInterseccion = new THREE.Vector3();

        let isCalibrated = false;
        let juegoTerminado = false;

        let textCanvas, textTexture, textMesh;

        const targetQuaternion = new THREE.Quaternion();
        const currentDeviceQuaternion = new THREE.Quaternion();
        const zee = new THREE.Vector3(0, 0, 1);
        const gq = new THREE.Quaternion();
        const europaQuaternion = new THREE.Euler();
        const correctionQuaternion = new THREE.Quaternion();

        // Colores del Manual de Marca Nimbloom
        const COLORES = {
            violeta: 0xA558CC,
            lavanda: 0xC2C2F4,
            lila: 0xD9AAF1,
            blanco: 0xFDF7FF,
            amarillo: 0xFFFEAE
        };

        btnIniciar.addEventListener('click', async () => {
            try {
                const constraints = {
                    video: {
                        facingMode: {
                            exact: "environment"
                        }
                    }
                };
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: true
                    });
                }
                videoElement.srcObject = stream;

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent
                    .requestPermission === 'function') {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') return;
                }

                document.getElementById('ui').style.display = 'none';
                contadorDiv.style.display = 'block';
                btnRecalibrar.style.display = 'block';

                // Forzar carga de fuentes en el canvas asegurándolas en el DOM oculto
                document.fonts.ready.then(() => {
                    init3D();
                    window.addEventListener('deviceorientation', handleOrientation, true);
                });

            } catch (error) {
                alert("Error de cámara.");
            }
        });

        btnRecalibrar.addEventListener('click', () => {
            isCalibrated = false;
        });

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            scene.add(camera);

            const canvas = document.getElementById('canvas-3d');
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const posicionesCercanas = [
                new THREE.Vector3(0, 0.2, -2.5),
                new THREE.Vector3(1.5, 0.5, -3.0),
                new THREE.Vector3(-1.8, -0.2, -2.8),
                new THREE.Vector3(0.8, 1.2, -3.2),
                new THREE.Vector3(-1.2, 1.0, -3.5),
                new THREE.Vector3(2.0, -0.5, -3.0),
                new THREE.Vector3(-2.0, 0.2, -3.2),
                new THREE.Vector3(0, -1, -2.8)
            ];

            posicionesCercanas.forEach((pos, index) => {
                const nubeGrupo = crearModeloNubeRealista();
                nubeGrupo.position.copy(pos);
                nubeGrupo.userData = {
                    id: index,
                    tamano: 1
                };
                scene.add(nubeGrupo);
                nubes.push(nubeGrupo);
            });

            actualizarContador();

            window.addEventListener('pointerdown', onPointerDown, false);
            window.addEventListener('pointermove', onPointerMove, false);
            window.addEventListener('pointerup', onPointerUp, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function crearModeloNubeRealista() {
            const grupo = new THREE.Group();

            // Las nubes inician con el Blanco de luminosidad
            const materialNube = new THREE.MeshLambertMaterial({
                color: COLORES.blanco,
                flatShading: true,
                transparent: true,
                opacity: 0.95
            });
            // El contorno negro se mantiene
            const materialContorno = new THREE.MeshBasicMaterial({
                color: 0x000000,
                side: THREE.BackSide
            });

            if (!scene.getObjectByName('luzAmbiental')) {
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
                ambientLight.name = 'luzAmbiental';
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(COLORES.lavanda, 0.6);
                directionalLight.position.set(5, 12, 8);
                scene.add(directionalLight);
            }

            const partesNube = [{
                    pos: [0, 0, 0],
                    escala: [1.2, 0.7, 0.8]
                },
                {
                    pos: [-0.5, 0.1, 0.0],
                    escala: [0.8, 0.6, 0.7]
                },
                {
                    pos: [0.5, 0.15, -0.1],
                    escala: [0.85, 0.65, 0.75]
                },
                {
                    pos: [0.2, 0.35, 0.1],
                    escala: [0.65, 0.55, 0.6]
                },
                {
                    pos: [-0.2, 0.3, -0.1],
                    escala: [0.7, 0.5, 0.65]
                },
                {
                    pos: [0, -0.25, 0.0],
                    escala: [0.9, 0.4, 0.7]
                }
            ];

            partesNube.forEach(p => {
                const geo = new THREE.SphereGeometry(0.35, 20, 20);
                const mesh = new THREE.Mesh(geo, materialNube);
                mesh.position.set(p.pos[0], p.pos[1], p.pos[2]);
                mesh.scale.set(p.escala[0], p.escala[1], p.escala[2]);
                grupo.add(mesh);

                const contorno = new THREE.Mesh(geo, materialContorno);
                contorno.position.copy(mesh.position);
                contorno.scale.set(p.escala[0] * 1.15, p.escala[1] * 1.15, p.escala[2] * 1.15);
                grupo.add(contorno);
            });

            return grupo;
        }

        function onPointerDown(event) {
            if (juegoTerminado) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nubes, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== scene) {
                    obj = obj.parent;
                }
                nubeArrastrada = obj;
                const normalCamara = camera.getWorldDirection(new THREE.Vector3()).negate();
                planoArrastre.setFromNormalAndCoplanarPoint(normalCamara, nubeArrastrada.position);
            }
        }

        function onPointerMove(event) {
            if (!nubeArrastrada || juegoTerminado) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(planoArrastre, puntoInterseccion)) {
                nubeArrastrada.position.copy(puntoInterseccion);
            }
        }

        function onPointerUp() {
            nubeArrastrada = null;
        }

        function crearLienzoTexto3D(nubeFinal) {
            textCanvas = document.createElement('canvas');
            textCanvas.width = 1024;
            textCanvas.height = 1024;
            textTexture = new THREE.CanvasTexture(textCanvas);
            textTexture.minFilter = THREE.LinearFilter;

            const planeGeo = new THREE.PlaneGeometry(1.3, 1.3);
            const planeMat = new THREE.MeshBasicMaterial({
                map: textTexture,
                transparent: true,
                depthWrite: false
            });
            textMesh = new THREE.Mesh(planeGeo, planeMat);

            textMesh.position.set(0, 0, -0.42);
            textMesh.rotation.y = Math.PI;
            nubeFinal.add(textMesh);
        }

        function actualizarTexturaNube() {
            if (!textCanvas) return;
            const ctx = textCanvas.getContext('2d');
            ctx.clearRect(0, 0, textCanvas.width, textCanvas.height);

            const ahora = new Date();
            let anioActual = ahora.getFullYear();
            let objetivo = new Date(anioActual, 9, 10, 0, 0, 0);
            if (ahora > objetivo) objetivo = new Date(anioActual + 1, 9, 10, 0, 0, 0);

            const dif = objetivo - ahora;
            const horas = Math.floor((dif % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((dif % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((dif % (1000 * 60)) / 1000);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Título en tipografía Cherry Bomb One y color Amarillo
            ctx.shadowColor = 'rgba(165, 88, 204, 0.9)'; // Sombra Violeta
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#FFFEAE'; // Amarillo
            ctx.font = '400 120px "Cherry Bomb One"';
            ctx.fillText('NIMBLOOM', 512, 300);

            // Reloj en tipografía Quicksand y color Violeta sobre nube blanca
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#A558CC'; // Violeta
            ctx.font = '700 90px "Quicksand"';
            ctx.fillText(
                `${String(horas).padStart(2, '0')}h ${String(minutos).padStart(2, '0')}m ${String(segundos).padStart(2, '0')}s`,
                512, 450);

            ctx.fillStyle = '#C2C2F4'; // Lavanda oscuro para contraste sutil
            ctx.font = '700 55px "Quicksand"';
            ctx.fillText('10 DE OCTUBRE', 512, 570);

            // Textos solicitados
            ctx.fillStyle = '#A558CC';
            ctx.font = '700 26px "Quicksand"';
            ctx.fillText('HECHO EN PALESTINA. FELICES 21, MARTÍN.', 512, 720);
            ctx.font = '600 22px "Quicksand"';
            ctx.fillText('(OJALÁ TE SIRVA PARA APROBAR DISEÑO MULTIMEDIAL)', 512, 770);

            textTexture.needsUpdate = true;
        }

        function verificarFusion() {
            if (juegoTerminado) return;

            for (let i = 0; i < nubes.length; i++) {
                for (let j = i + 1; j < nubes.length; j++) {
                    const n1 = nubes[i];
                    const n2 = nubes[j];

                    const distancia = n1.position.distanceTo(n2.position);
                    const radioVisual1 = Math.cbrt(n1.userData.tamano) * 0.4;
                    const radioVisual2 = Math.cbrt(n2.userData.tamano) * 0.4;

                    if (distancia < (radioVisual1 + radioVisual2 + 0.5)) {
                        n1.userData.tamano += n2.userData.tamano;
                        const nuevaEscala = Math.cbrt(n1.userData.tamano) * 0.65;
                        n1.scale.set(nuevaEscala, nuevaEscala, nuevaEscala);

                        scene.remove(n2);
                        nubes.splice(j, 1);
                        actualizarContador();

                        // Ocurre el evento Nimbloom (el abrazo completado)
                        if (nubes.length === 1) {
                            juegoTerminado = true;
                            contadorDiv.style.display = 'none';
                            btnRecalibrar.style.display = 'none';

                            crearLienzoTexto3D(n1);
                            camera.attach(n1);
                        }
                        return;
                    }
                }
            }
        }

        function actualizarContador() {
            contadorDiv.innerText = "Nubes: " + nubes.length;
        }

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

            europaQuaternion.set(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(europaQuaternion);
            targetQuaternion.multiply(gq.setFromAxisAngle(zee, -orient));

            if (!isCalibrated) {
                correctionQuaternion.copy(targetQuaternion).invert();
                isCalibrated = true;
            }

            let tempQuat = new THREE.Quaternion().copy(targetQuaternion).premultiply(correctionQuaternion);
            currentDeviceQuaternion.copy(tempQuat);
        }

        function animate() {
            requestAnimationFrame(animate);

            camera.quaternion.slerp(currentDeviceQuaternion, 0.08);

            if (juegoTerminado && nubes.length > 0) {
                const nubeFinal = nubes[0];

                nubeFinal.position.lerp(new THREE.Vector3(0, 0, -3.5), 0.04);
                nubeFinal.scale.lerp(new THREE.Vector3(2.2, 2.2, 2.2), 0.03);

                const targetRot = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI, 0));
                nubeFinal.quaternion.slerp(targetRot, 0.04);

                // Representación del "cambio lumínico" usando la paleta oficial
                nubeFinal.traverse((child) => {
                    if (child.isMesh && child !== textMesh && child.material.side !== THREE.BackSide) {
                        const tiempo = Date.now() * 0.001;
                        // Interpola suavemente entre los colores Lavanda (#C2C2F4) y Lila (#D9AAF1)
                        const r = 194 + Math.sin(tiempo) * 23;
                        const g = 194 - Math.sin(tiempo) * 24;
                        const b = 244 + Math.sin(tiempo) * -3;
                        child.material.color.setRGB(r / 255, g / 255, b / 255);
                    }
                });

                actualizarTexturaNube();
            }

            verificarFusion();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>

</html>
