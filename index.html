<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nimbloom</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: 'Quicksand', sans-serif;
            touch-action: none;
        }

        #camara-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #version-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            color: #FDF7FF;
            background: rgba(165, 88, 204, 0.5);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }

        #btn-recalibrar {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 20;
            background: rgba(194, 194, 244, 0.8);
            color: #A558CC;
            border: 2px solid #FDF7FF;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            pointer-events: auto;
        }

        #contador-nubes {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 20;
            color: #A558CC;
            background: rgba(253, 247, 255, 0.8);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            pointer-events: none;
            display: none;
        }

        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }

        h1.titulo-juego {
            color: #FDF7FF;
            font-family: 'Cherry Bomb One', cursive;
            font-size: 50px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(217, 170, 241, 0.8);
            -webkit-text-stroke: 1px #A558CC;
        }

        .btn-principal {
            background-color: #A558CC;
            border: 2px solid #FDF7FF;
            color: #FDF7FF;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            width: 100%;
            pointer-events: auto;
            font-family: 'Quicksand', sans-serif;
            transition: all 0.3s ease;
        }

        .btn-principal:disabled {
            background-color: #ccc;
            color: #666;
            cursor: not-allowed;
            border-color: #999;
        }

        .btn-principal:not(:disabled):active {
            background-color: #FFFEAE;
            color: #A558CC;
        }

        #info {
            color: #A558CC;
            background: rgba(253, 247, 255, 0.9);
            border: 1px solid #C2C2F4;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 25px;
            pointer-events: auto;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <button id="btn-recalibrar">⟲ Centrar espacio</button>
    <div id="version-tag">version 1.19</div>
    <div id="contador-nubes">Nubes: 8</div>

    <video id="camara-video" autoplay playsinline muted></video>
    <canvas id="canvas-3d"></canvas>

    <div id="ui">
        <h1 class="titulo-juego">Nimbloom</h1>
        <div id="info">Tomate un momento para vos. Mirá a tu alrededor, buscá las nubes por toda la habitación y unelas.
        </div>
        <button id="btn-iniciar" class="btn-principal" disabled>CARGANDO MODELO...</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const btnIniciar = document.getElementById('btn-iniciar');
        const btnRecalibrar = document.getElementById('btn-recalibrar');
        const infoDiv = document.getElementById('info');
        const videoElement = document.getElementById('camara-video');
        const contadorDiv = document.getElementById('contador-nubes');

        let scene, camera, renderer;
        let nubes = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let nubeArrastrada = null;
        let planoArrastre = new THREE.Plane();
        let puntoInterseccion = new THREE.Vector3();

        let isCalibrated = false;
        let juegoTerminado = false;
        let modeloGLTFBase = null;
        let textCanvas, textTexture, textMesh;

        // ==========================================
        // VARIABLES DE AJUSTE
        // ==========================================
        const ESCALA_MODELO_GLTF = 0.2;
        const TAMAÑO_TEXTO = 0.9;
        const ALTURA_TEXTO = 1.0;
        const PROFUNDIDAD_TEXTO = -0.5;
        const ALTURA_MODELO_FINAL = -0.8;
        // ==========================================

        const targetQuaternion = new THREE.Quaternion();
        const currentDeviceQuaternion = new THREE.Quaternion();
        const zee = new THREE.Vector3(0, 0, 1);
        const gq = new THREE.Quaternion();
        const europaQuaternion = new THREE.Euler();
        const correctionQuaternion = new THREE.Quaternion();

        const COLORES = {
            violeta: 0xA558CC,
            lavanda: 0xC2C2F4,
            lila: 0xD9AAF1,
            blanco: 0xFDF7FF,
            amarillo: 0xFFFEAE
        };

        const loader = new THREE.GLTFLoader();
        loader.load('model/nube.glb', function (gltf) {
            modeloGLTFBase = gltf.scene;

            const materialNube = new THREE.MeshLambertMaterial({
                color: COLORES.blanco,
                flatShading: true,
                transparent: true,
                opacity: 0.95
            });
            const materialContorno = new THREE.MeshBasicMaterial({
                color: 0x000000,
                side: THREE.BackSide
            });

            const mallas = [];
            modeloGLTFBase.traverse((child) => {
                if (child.isMesh) mallas.push(child);
            });

            mallas.forEach((mesh) => {
                mesh.material = materialNube;
                const contorno = new THREE.Mesh(mesh.geometry, materialContorno);
                contorno.scale.set(1.05, 1.05, 1.05);
                mesh.add(contorno);
            });

            btnIniciar.innerText = "CONECTAR";
            btnIniciar.disabled = false;

        }, undefined, function (error) {
            infoDiv.innerText = "Error al cargar model/nube.glb. Verifica la ruta.";
        });

        btnIniciar.addEventListener('click', async () => {
            try {
                const constraints = {
                    video: {
                        facingMode: {
                            exact: "environment"
                        }
                    }
                };
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: true
                    });
                }
                videoElement.srcObject = stream;

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent
                    .requestPermission === 'function') {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') return;
                }

                document.getElementById('ui').style.display = 'none';
                contadorDiv.style.display = 'block';
                btnRecalibrar.style.display = 'block';

                document.fonts.ready.then(() => {
                    init3D();
                    window.addEventListener('deviceorientation', handleOrientation, true);
                });

            } catch (error) {
                alert("Error de cámara.");
            }
        });

        btnRecalibrar.addEventListener('click', () => {
            isCalibrated = false;
        });

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            scene.add(camera);

            const canvas = document.getElementById('canvas-3d');
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            if (!scene.getObjectByName('luzAmbiental')) {
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
                ambientLight.name = 'luzAmbiental';
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(COLORES.lavanda, 0.6);
                directionalLight.position.set(5, 12, 8);
                scene.add(directionalLight);
            }

            const posicionesAlrededor = [
                new THREE.Vector3(0, 0.5, -3.0), // 1. Frente
                new THREE.Vector3(2.5, 0.2, -2.0), // 2. Derecha cerca
                new THREE.Vector3(-2.5, 0.2, -2.0), // 3. Izquierda cerca
                new THREE.Vector3(3.0, 1.0, 1.0), // 4. A la derecha y atrás
                new THREE.Vector3(-3.0, 1.0, 1.0), // 5. A la izquierda y atrás
                new THREE.Vector3(0, 2.5, -1.5), // 6. Arriba
                new THREE.Vector3(0, -1.5, -2.5), // 7. Abajo
                new THREE.Vector3(0, 0.5, 3.0) // 8. Totalmente a tus espaldas
            ];

            posicionesAlrededor.forEach((pos, index) => {
                const nubeGrupo = new THREE.Group();
                const nubeVisual = modeloGLTFBase.clone();
                nubeVisual.scale.set(ESCALA_MODELO_GLTF, ESCALA_MODELO_GLTF, ESCALA_MODELO_GLTF);

                nubeGrupo.add(nubeVisual);
                nubeGrupo.position.copy(pos);
                nubeGrupo.userData = {
                    id: index,
                    tamano: 1
                };

                scene.add(nubeGrupo);
                nubes.push(nubeGrupo);
            });

            actualizarContador();

            window.addEventListener('pointerdown', onPointerDown, false);
            window.addEventListener('pointermove', onPointerMove, false);
            window.addEventListener('pointerup', onPointerUp, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onPointerDown(event) {
            if (juegoTerminado) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nubes, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== scene) {
                    obj = obj.parent;
                }
                nubeArrastrada = obj;

                // Plano de arrastre dinámico basado en la distancia actual de la nube a la cámara
                const distanciaCamara = camera.position.distanceTo(nubeArrastrada.position);
                planoArrastre.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()).negate(),
                    nubeArrastrada.position);
            }
        }

        function onPointerMove(event) {
            if (!nubeArrastrada || juegoTerminado) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(planoArrastre, puntoInterseccion)) {
                nubeArrastrada.position.copy(puntoInterseccion);
            }
        }

        function onPointerUp() {
            nubeArrastrada = null;
        }

        function crearLienzoTexto3D(nubeFinal) {
            textCanvas = document.createElement('canvas');
            textCanvas.width = 1024;
            textCanvas.height = 1024;
            textTexture = new THREE.CanvasTexture(textCanvas);
            textTexture.minFilter = THREE.LinearFilter;

            const planeGeo = new THREE.PlaneGeometry(TAMAÑO_TEXTO, TAMAÑO_TEXTO);

            const planeMat = new THREE.MeshBasicMaterial({
                map: textTexture,
                transparent: true,
                depthWrite: false,
                depthTest: false
            });

            textMesh = new THREE.Mesh(planeGeo, planeMat);
            textMesh.renderOrder = 999;

            textMesh.position.set(0, ALTURA_TEXTO, PROFUNDIDAD_TEXTO);
            textMesh.rotation.y = Math.PI;

            textMesh.scale.set(0.01, 0.01, 0.01);
            nubeFinal.add(textMesh);
        }

        function actualizarTexturaNube() {
            if (!textCanvas) return;
            const ctx = textCanvas.getContext('2d');
            ctx.clearRect(0, 0, textCanvas.width, textCanvas.height);

            const ahora = new Date();
            let anioActual = ahora.getFullYear();
            let objetivo = new Date(anioActual, 9, 10, 0, 0, 0);
            if (ahora > objetivo) objetivo = new Date(anioActual + 1, 9, 10, 0, 0, 0);

            const dif = objetivo - ahora;
            const dias = Math.floor(dif / (1000 * 60 * 60 * 24));
            const horas = Math.floor((dif % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((dif % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((dif % (1000 * 60)) / 1000);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.shadowColor = 'rgba(165, 88, 204, 0.9)';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#FFFEAE';
            ctx.font = '400 120px "Cherry Bomb One"';
            ctx.fillText('NIMBLOOM', 512, 250);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#A558CC';
            ctx.font = '700 80px "Quicksand"';
            ctx.fillText(
                `${dias}d ${String(horas).padStart(2, '0')}h ${String(minutos).padStart(2, '0')}m ${String(segundos).padStart(2, '0')}s`,
                512, 420);

            ctx.fillStyle = '#C2C2F4';
            ctx.font = '700 50px "Quicksand"';
            ctx.fillText('10 DE OCTUBRE', 512, 540);

            ctx.fillStyle = '#A558CC';
            ctx.font = '700 28px "Quicksand"';
            ctx.fillText('HECHO EN PALESTINA. FELICES 21, MARTÍN.', 512, 700);
            ctx.font = '600 24px "Quicksand"';
            ctx.fillText('(OJALÁ TE SIRVA PARA APROBAR DISEÑO MULTIMEDIAL)', 512, 750);

            textTexture.needsUpdate = true;
        }

        function verificarFusion() {
            if (juegoTerminado) return;

            for (let i = 0; i < nubes.length; i++) {
                for (let j = i + 1; j < nubes.length; j++) {
                    const n1 = nubes[i];
                    const n2 = nubes[j];

                    const distancia = n1.position.distanceTo(n2.position);

                    // --- CORRECCIÓN CLAVE DE FUSIÓN ---
                    // Ampliamos generosamente el margen de detección (multiplicador 1.8) 
                    // para que no importa cuán grandes sean, siempre se absorban con facilidad.
                    const radioVisual1 = Math.cbrt(n1.userData.tamano) * 0.6;
                    const radioVisual2 = Math.cbrt(n2.userData.tamano) * 0.6;
                    const umbralFusion = (radioVisual1 + radioVisual2) * 1.8;

                    if (distancia < umbralFusion) {
                        n1.userData.tamano += n2.userData.tamano;

                        const baseScale = ESCALA_MODELO_GLTF;
                        const growthFactor = Math.cbrt(n1.userData.tamano);
                        const nuevaEscala = baseScale * growthFactor;
                        n1.children[0].scale.set(nuevaEscala, nuevaEscala, nuevaEscala);

                        scene.remove(n2);
                        nubes.splice(j, 1);
                        actualizarContador();

                        if (nubes.length === 1) {
                            juegoTerminado = true;
                            contadorDiv.style.display = 'none';
                            btnRecalibrar.style.display = 'none';

                            crearLienzoTexto3D(n1);
                            camera.attach(n1);
                        }
                        return;
                    }
                }
            }
        }

        function actualizarContador() {
            contadorDiv.innerText = "Nubes: " + nubes.length;
        }

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

            europaQuaternion.set(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(europaQuaternion);
            targetQuaternion.multiply(gq.setFromAxisAngle(zee, -orient));

            if (!isCalibrated) {
                correctionQuaternion.copy(targetQuaternion).invert();
                isCalibrated = true;
            }

            let tempQuat = new THREE.Quaternion().copy(targetQuaternion).premultiply(correctionQuaternion);
            currentDeviceQuaternion.copy(tempQuat);
        }

        function animate() {
            requestAnimationFrame(animate);

            camera.quaternion.slerp(currentDeviceQuaternion, 0.08);

            if (juegoTerminado && nubes.length > 0) {
                const nubeFinal = nubes[0];

                nubeFinal.position.lerp(new THREE.Vector3(0, ALTURA_MODELO_FINAL, -3.5), 0.04);

                const finalScale = ESCALA_MODELO_GLTF * 4;
                nubeFinal.children[0].scale.lerp(new THREE.Vector3(finalScale * 1.8, finalScale * 1.1, finalScale *
                    1.1), 0.03);

                if (textMesh) {
                    const textoScale = finalScale * 3.5;
                    textMesh.scale.lerp(new THREE.Vector3(textoScale, textoScale, textoScale), 0.03);
                }

                const targetRot = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI, 0));
                nubeFinal.quaternion.slerp(targetRot, 0.04);

                nubeFinal.traverse((child) => {
                    if (child.isMesh && child !== textMesh && child.material.side !== THREE.BackSide) {
                        const tiempo = Date.now() * 0.001;
                        const r = 194 + Math.sin(tiempo) * 23;
                        const g = 194 - Math.sin(tiempo) * 24;
                        const b = 244 + Math.sin(tiempo) * -3;
                        child.material.color.setRGB(r / 255, g / 255, b / 255);
                    }
                });

                actualizarTexturaNube();
            }

            verificarFusion();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>

</html>
