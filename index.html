<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nimbloom</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
            touch-action: none;
        }

        #camara-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #version-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }

        #btn-recalibrar {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            display: none;
            pointer-events: auto;
        }

        #contador-nubes {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 20;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            display: none;
        }

        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }

        h1.titulo-juego {
            color: #ffffff;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
            -webkit-text-stroke: 1px black;
        }

        .btn-principal {
            background-color: #ffcc00;
            border: 2px solid black;
            color: #000;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            width: 100%;
            pointer-events: auto;
        }

        #info {
            color: #ddd;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid black;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            pointer-events: auto;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <button id="btn-recalibrar">⟲ Recalibrar</button>
    <div id="version-tag">version 1.11</div>
    <div id="contador-nubes">Nubes: 8</div>

    <video id="camara-video" autoplay playsinline muted></video>
    <canvas id="canvas-3d"></canvas>

    <div id="ui">
        <h1 class="titulo-juego">Nimbloom</h1>
        <div id="info">Apunta al frente y toca Iniciar. Arrastra las nubes para unirlas todas en una sola.</div>
        <button id="btn-iniciar" class="btn-principal">INICIAR EXPERIENCIA</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const btnIniciar = document.getElementById('btn-iniciar');
        const btnRecalibrar = document.getElementById('btn-recalibrar');
        const infoDiv = document.getElementById('info');
        const videoElement = document.getElementById('camara-video');
        const contadorDiv = document.getElementById('contador-nubes');

        let scene, camera, renderer;
        let nubes = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let nubeArrastrada = null;
        let planoArrastre = new THREE.Plane();
        let puntoInterseccion = new THREE.Vector3();

        let isCalibrated = false;
        let juegoTerminado = false;

        // Elementos para el texto 3D holográfico
        let textCanvas, textTexture, textMesh;

        const targetQuaternion = new THREE.Quaternion();
        const currentDeviceQuaternion = new THREE.Quaternion();
        const zee = new THREE.Vector3(0, 0, 1);
        const gq = new THREE.Quaternion();
        const europaQuaternion = new THREE.Euler();
        const correctionQuaternion = new THREE.Quaternion();

        btnIniciar.addEventListener('click', async () => {
            try {
                const constraints = {
                    video: {
                        facingMode: {
                            exact: "environment"
                        }
                    }
                };
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: true
                    });
                }
                videoElement.srcObject = stream;

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent
                    .requestPermission === 'function') {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        infoDiv.innerText = "Permiso de sensores denegado.";
                        return;
                    }
                }

                document.getElementById('ui').style.display = 'none';
                contadorDiv.style.display = 'block';
                btnRecalibrar.style.display = 'block';
                init3D();
                window.addEventListener('deviceorientation', handleOrientation, true);

            } catch (error) {
                alert("Error: Asegúrate de usar HTTPS o permisos de cámara.");
                infoDiv.innerText = "Error al iniciar: " + error;
            }
        });

        btnRecalibrar.addEventListener('click', () => {
            isCalibrated = false;
        });

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            scene.add(camera); // Importante para vincular objetos a la cámara luego

            const canvas = document.getElementById('canvas-3d');
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            const posicionesCercanas = [
                new THREE.Vector3(0, 0.2, -2.5),
                new THREE.Vector3(1.5, 0.5, -3.0),
                new THREE.Vector3(-1.8, -0.2, -2.8),
                new THREE.Vector3(0.8, 1.2, -3.2),
                new THREE.Vector3(-1.2, 1.0, -3.5),
                new THREE.Vector3(2.0, -0.5, -3.0),
                new THREE.Vector3(-2.0, 0.2, -3.2),
                new THREE.Vector3(0, -1, -2.8)
            ];

            posicionesCercanas.forEach((pos, index) => {
                const nubeGrupo = crearModeloNubeRealista();
                nubeGrupo.position.copy(pos);
                nubeGrupo.userData = {
                    id: index,
                    tamano: 1
                };
                scene.add(nubeGrupo);
                nubes.push(nubeGrupo);
            });

            actualizarContador();

            window.addEventListener('pointerdown', onPointerDown, false);
            window.addEventListener('pointermove', onPointerMove, false);
            window.addEventListener('pointerup', onPointerUp, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function crearModeloNubeRealista() {
            const grupo = new THREE.Group();
            const materialNube = new THREE.MeshLambertMaterial({
                color: 0xffffff,
                flatShading: true,
                transparent: true,
                opacity: 0.95
            });
            const materialContorno = new THREE.MeshBasicMaterial({
                color: 0x000000,
                side: THREE.BackSide
            });

            if (!scene.getObjectByName('luzAmbiental')) {
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
                ambientLight.name = 'luzAmbiental';
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
                directionalLight.position.set(5, 12, 8);
                scene.add(directionalLight);
            }

            const partesNube = [{
                    pos: [0, 0, 0],
                    escala: [1.2, 0.7, 0.8]
                },
                {
                    pos: [-0.5, 0.1, 0.0],
                    escala: [0.8, 0.6, 0.7]
                },
                {
                    pos: [0.5, 0.15, -0.1],
                    escala: [0.85, 0.65, 0.75]
                },
                {
                    pos: [0.2, 0.35, 0.1],
                    escala: [0.65, 0.55, 0.6]
                },
                {
                    pos: [-0.2, 0.3, -0.1],
                    escala: [0.7, 0.5, 0.65]
                },
                {
                    pos: [0, -0.25, 0.0],
                    escala: [0.9, 0.4, 0.7]
                }
            ];

            partesNube.forEach(p => {
                const geo = new THREE.SphereGeometry(0.35, 20, 20);
                const mesh = new THREE.Mesh(geo, materialNube);
                mesh.position.set(p.pos[0], p.pos[1], p.pos[2]);
                mesh.scale.set(p.escala[0], p.escala[1], p.escala[2]);
                grupo.add(mesh);

                const contorno = new THREE.Mesh(geo, materialContorno);
                contorno.position.copy(mesh.position);
                contorno.scale.set(p.escala[0] * 1.15, p.escala[1] * 1.15, p.escala[2] * 1.15);
                grupo.add(contorno);
            });

            return grupo;
        }

        function onPointerDown(event) {
            if (juegoTerminado) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nubes, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== scene) {
                    obj = obj.parent;
                }
                nubeArrastrada = obj;
                const normalCamara = camera.getWorldDirection(new THREE.Vector3()).negate();
                planoArrastre.setFromNormalAndCoplanarPoint(normalCamara, nubeArrastrada.position);
            }
        }

        function onPointerMove(event) {
            if (!nubeArrastrada || juegoTerminado) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(planoArrastre, puntoInterseccion)) {
                nubeArrastrada.position.copy(puntoInterseccion);
            }
        }

        function onPointerUp() {
            nubeArrastrada = null;
        }

        function crearLienzoTexto3D(nubeFinal) {
            // Creamos un canvas virtual fuera de pantalla para escribir con HTML5 Canvas
            textCanvas = document.createElement('canvas');
            textCanvas.width = 1024;
            textCanvas.height = 1024;
            textTexture = new THREE.CanvasTexture(textCanvas);
            textTexture.minFilter = THREE.LinearFilter;

            const planeGeo = new THREE.PlaneGeometry(3.5, 3.5);
            const planeMat = new THREE.MeshBasicMaterial({
                map: textTexture,
                transparent: true,
                depthWrite: false
            });
            textMesh = new THREE.Mesh(planeGeo, planeMat);

            // Lo pegamos a la parte TRASERA de la nube y lo damos vuelta
            textMesh.position.set(0, 0, -1.0);
            textMesh.rotation.y = Math.PI;
            nubeFinal.add(textMesh);
        }

        function actualizarTexturaNube() {
            if (!textCanvas) return;
            const ctx = textCanvas.getContext('2d');
            ctx.clearRect(0, 0, textCanvas.width, textCanvas.height);

            const ahora = new Date();
            let anioActual = ahora.getFullYear();
            let objetivo = new Date(anioActual, 9, 10, 0, 0, 0);
            if (ahora > objetivo) objetivo = new Date(anioActual + 1, 9, 10, 0, 0, 0);

            const dif = objetivo - ahora;
            const horas = Math.floor((dif % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((dif % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((dif % (1000 * 60)) / 1000);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.shadowColor = 'rgba(255, 204, 0, 0.9)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 130px sans-serif';
            ctx.fillText('NIMBLOOM', 512, 250);

            ctx.shadowBlur = 10;
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 90px sans-serif';
            ctx.fillText(
                `${String(horas).padStart(2, '0')}h ${String(minutos).padStart(2, '0')}m ${String(segundos).padStart(2, '0')}s`,
                512, 420);

            ctx.shadowBlur = 5;
            ctx.fillStyle = '#dddddd';
            ctx.font = 'bold 60px sans-serif';
            ctx.fillText('10 DE OCTUBRE', 512, 550);

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('HECHO EN PALESTINA. FELICES 21, MARTÍN.', 512, 750);
            ctx.font = '24px sans-serif';
            ctx.fillText('(OJALÁ TE SIRVA PARA APROBAR DISEÑO MULTIMEDIAL)', 512, 800);

            textTexture.needsUpdate = true;
        }

        function verificarFusion() {
            if (juegoTerminado) return;

            for (let i = 0; i < nubes.length; i++) {
                for (let j = i + 1; j < nubes.length; j++) {
                    const n1 = nubes[i];
                    const n2 = nubes[j];

                    const distancia = n1.position.distanceTo(n2.position);
                    const radioVisual1 = Math.cbrt(n1.userData.tamano) * 0.4;
                    const radioVisual2 = Math.cbrt(n2.userData.tamano) * 0.4;

                    if (distancia < (radioVisual1 + radioVisual2 + 0.5)) {
                        n1.userData.tamano += n2.userData.tamano;
                        const nuevaEscala = Math.cbrt(n1.userData.tamano) * 0.65;
                        n1.scale.set(nuevaEscala, nuevaEscala, nuevaEscala);

                        scene.remove(n2);
                        nubes.splice(j, 1);
                        actualizarContador();

                        if (nubes.length === 1) {
                            juegoTerminado = true;
                            contadorDiv.style.display = 'none';
                            btnRecalibrar.style.display = 'none';

                            // Transformar la nube final en el HUD 3D
                            crearLienzoTexto3D(n1);

                            // Adherir la nube a la cámara para que flote siempre en tu pantalla
                            camera.attach(n1);
                        }
                        return;
                    }
                }
            }
        }

        function actualizarContador() {
            contadorDiv.innerText = "Nubes: " + nubes.length;
        }

        function handleOrientation(event) {
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

            europaQuaternion.set(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(europaQuaternion);
            targetQuaternion.multiply(gq.setFromAxisAngle(zee, -orient));

            if (!isCalibrated) {
                correctionQuaternion.copy(targetQuaternion).invert();
                isCalibrated = true;
            }

            let tempQuat = new THREE.Quaternion().copy(targetQuaternion).premultiply(correctionQuaternion);
            currentDeviceQuaternion.copy(tempQuat);
        }

        function animate() {
            requestAnimationFrame(animate);

            camera.quaternion.slerp(currentDeviceQuaternion, 0.08);

            if (juegoTerminado && nubes.length > 0) {
                const nubeFinal = nubes[0];

                // Movimiento suave local al centro de la cámara (Efecto paneo y anclaje)
                nubeFinal.position.lerp(new THREE.Vector3(0, 0, -3.5), 0.04);

                // Rotación suave para darse vuelta y revelar el texto (180 grados)
                const targetRot = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI, 0));
                nubeFinal.quaternion.slerp(targetRot, 0.04);

                // Efecto de brillo y cambio de colores
                nubeFinal.traverse((child) => {
                    if (child.isMesh && child !== textMesh && child.material.side !== THREE.BackSide) {
                        const tonoHue = (Date.now() * 0.05) % 360;
                        child.material.color.setHSL(tonoHue / 360, 0.8, 0.7);
                    }
                });

                actualizarTexturaNube();
            }

            verificarFusion();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>

</html>
