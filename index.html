<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nimbloom - Anclaje Fijo AR</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }

        #camara-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        #ui {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        button {
            background-color: #ffcc00;
            border: none;
            color: #000;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            width: 100%;
        }

        #info {
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <video id="camara-video" autoplay playsinline muted></video>
    <canvas id="canvas-3d"></canvas>

    <div id="ui">
        <div id="info">Toca para iniciar y quédate mirando al frente para fijar la esfera</div>
        <button id="btn-iniciar">INICIAR EXPERIENCIA</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const btnIniciar = document.getElementById('btn-iniciar');
        const infoDiv = document.getElementById('info');
        const videoElement = document.getElementById('camara-video');

        let scene, camera, renderer, esfera;
        const targetQuaternion = new THREE.Quaternion();
        const zee = new THREE.Vector3(0, 0, 1);
        const gq = new THREE.Quaternion();
        const europaQuaternion = new THREE.Euler();

        btnIniciar.addEventListener('click', async () => {
            try {
                const constraints = {
                    video: {
                        facingMode: {
                            exact: "environment"
                        }
                    }
                };
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: true
                    });
                }
                videoElement.srcObject = stream;

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent
                    .requestPermission === 'function') {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        infoDiv.innerText = "Permiso de sensores denegado.";
                        return;
                    }
                }

                document.getElementById('ui').style.display = 'none';
                init3D();
                window.addEventListener('deviceorientation', handleOrientation, true);

            } catch (error) {
                alert("Error: Asegúrate de usar HTTPS o permisos de cámara.");
                infoDiv.innerText = "Error al iniciar: " + error;
            }
        });

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const canvas = document.getElementById('canvas-3d');
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Crear esfera (nube provisional)
            const geometry = new THREE.SphereGeometry(1, 32, 32);
            const material = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true
            });
            esfera = new THREE.Mesh(geometry, material);

            // Ubicar la esfera fija a 4 metros exactamente frente a donde arrancas la app
            esfera.position.set(0, 0, -4);
            scene.add(esfera);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function handleOrientation(event) {
            // Conversión matemática estándar para alinear los ejes del giroscopio del celular con Three.js
            const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
            const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
            const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
            const orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

            europaQuaternion.set(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(europaQuaternion);

            // Ajustar orientación al plano de la pantalla
            targetQuaternion.multiply(gq.setFromAxisAngle(zee, -orient));

            // Aplicar rotación absoluta a la cámara virtual del mundo 3D
            camera.quaternion.copy(targetQuaternion);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (esfera) {
                esfera.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>

</html>
